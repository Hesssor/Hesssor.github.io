<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kontraktsrätt – Studiebok</title></head><body><p style="font-family:system-ui;padding:24px">Laddar studieboken…</p><script>(async()=>{const ps=Array.from({length:12},(_,i)=>"parts/part"+String(i+1).padStart(2,"0")+".txt");let h="";for(const p of ps){const r=await fetch(p,{cache:"no-store"});if(!r.ok)throw new Error(p);h+=await r.text()}document.open();document.write(h);document.close()})().catch(e=>document.body.innerHTML="<pre style=\"white-space:pre-wrap;font-family:system-ui;padding:24px\">Kunde inte ladda studieboken: "+String(e)+"</pre>");</script></body></html>
